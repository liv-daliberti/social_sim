experiment:
  id: three_city_c2_v9_clean_information_relevance
  version: 9
  run_directory: data/three_city_c2_v9/full_k1_5_clean_information
  execution: local_login_node

design:
  episodes: 120
  seed_offset: 91000
  evidence_rounds: [1, 2, 3, 4, 5]
  cumulative_city_c_cases: [1, 2, 4, 8, 16]
  reference_cases_per_city: 8
  task_count_per_arm: 600
  calls_per_model: 1800
  total_calls_three_models: 5400

arms:
  - id: c_only
    information: City C observations and City C profile score only
    guidance: neutral
  - id: abc
    information: City A, B, and C observations and continuous profile scores
    guidance: neutral
  - id: abc_relevance
    information: identical to abc
    guidance: non-prescriptive graded relevance hint

continuous_dgp:
  starting_poll: 50.0
  news_value: 8
  case_noise_sd_poll_points: 4.0
  city_deviation_sd_response_units: 0.18
  low_reference_profile_range: [0.10, 0.35]
  high_reference_profile_range: [0.65, 0.90]
  target_profile_margin_inside_references: 0.05
  episode_intercept_range: [0.30, 0.45]
  episode_profile_slope_range: [0.35, 0.65]
  discrete_city_types: false
  fixed_zero_or_hundred_reference_scores: false

estimators:
  city_c_only: through-origin regression using displayed City C cases
  abc_matched: continuous A/B interpolation prior updated with the same City C regression
  prior_variance: derived from preregistered city deviation and reference sampling variance

models:
  - claude-opus-4-8
  - DeepSeek-V4-Pro
  - gpt-5.4

generation:
  temperature: 0
  max_tokens: 512
  max_attempts: 1
