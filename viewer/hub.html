<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Social Sim — Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; overflow: hidden; }
    #frames { width: 100vw; height: 100vh; position: relative; }
    iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none;
    }
    iframe.hidden { display: none; }

    #tab-bar {
      position: fixed; bottom: 0; right: 0; z-index: 9999;
      display: flex;
      align-items: stretch;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-top-left-radius: 8px;
      border: 1px solid #334155;
      border-bottom: none;
      border-right: none;
    }

    .tab {
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.03em;
      color: #64748b;
      cursor: pointer;
      transition: color .12s, background .12s;
      border-right: 1px solid #334155;
      user-select: none;
      white-space: nowrap;
      display: flex;
      align-items: center;
    }
    .tab:last-child { border-right: none; }
    .tab:hover { color: #cbd5e1; background: rgba(255,255,255,0.04); }
    .tab.active { color: #38bdf8; background: rgba(12, 74, 110, 0.6); }
  </style>
</head>
<body>
  <div id="tab-bar">
    <div class="tab active" data-frame="f1">Exp 1 — Prospective</div>
    <div class="tab"        data-frame="f2">Exp 2 — Simulations</div>
    <div class="tab"        data-frame="f3">Exp 3 — Transfer</div>
  </div>

  <div id="frames">
    <iframe id="f1" src="/exp1/"></iframe>
    <iframe id="f2" src="/exp2/" class="hidden"></iframe>
    <iframe id="f3" src="/exp3/" class="hidden"></iframe>
  </div>

  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('iframe').forEach(f => f.classList.add('hidden'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.frame).classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
